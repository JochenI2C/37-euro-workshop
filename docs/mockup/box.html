<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GICHTKLAR 14 · 3D-Box-Mockup</title>
<!--
  Quelle für bilder/cover.png. Neu rendern mit:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --default-background-color=00000000 --window-size=1080,1440 \
    --screenshot=bilder/cover.png "file://$PWD/docs/mockup/box.html"
-->
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1440px;background:transparent;overflow:hidden;}
body{font-family:Helvetica,Arial,sans-serif;}
:root{--blue:#3383C5;--blue-dark:#1159AF;--light:#85CBFF;--navy:#1A2B42;--navy2:#13202F;}

.scene{position:absolute;left:0;top:0;width:1080px;height:1440px;perspective:2600px;perspective-origin:42% 45%;}
.shadow{position:absolute;left:120px;top:1245px;width:840px;height:90px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(10,20,35,.42) 0%,rgba(10,20,35,.18) 45%,rgba(10,20,35,0) 72%);filter:blur(6px);}
.box{position:absolute;left:270px;top:150px;width:660px;height:1080px;transform-style:preserve-3d;
  transform:rotateX(-3deg) rotateY(33deg);}
.face{position:absolute;top:0;height:1080px;overflow:hidden;backface-visibility:hidden;}

/* Vorderseite */
.front{left:0;width:660px;transform:translateZ(105px);
  background:linear-gradient(160deg,#22395A 0%,var(--navy) 45%,var(--navy2) 100%);}
.front::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(0,0,0,.10) 100%);}

/* Seitenrücken links */
.side{left:225px;width:210px;transform:rotateY(-90deg) translateZ(330px);
  background:linear-gradient(90deg,#0F1A27 0%,#16263A 70%,#1A2D44 100%);}
.side::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 60%);}

/* Oberseite (minimal sichtbar) */
.top{left:225px;top:-105px;width:210px;height:210px;}

/* Inhalt Vorderseite */
.brand{position:absolute;left:46px;top:46px;display:flex;align-items:center;gap:14px;}
.brand .g{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.brand .g img{width:44px;height:44px;}
.brand .t{color:#fff;font-weight:700;font-size:19px;letter-spacing:2px;line-height:1.05;}
.brand .t span{display:block;color:var(--light);}

.badge{position:absolute;right:42px;top:0;width:118px;height:168px;background:var(--blue);
  border-radius:0 0 59px 59px;color:#fff;text-align:center;padding-top:26px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
.badge b{display:block;font-size:64px;font-weight:900;line-height:1;}
.badge i{display:block;font-style:normal;font-size:22px;font-weight:800;letter-spacing:2px;margin-top:4px;}

.title{position:absolute;left:0;right:0;top:228px;text-align:center;color:#fff;font-weight:900;
  font-size:96px;line-height:.95;letter-spacing:-1px;}
.title span{color:var(--blue);}
.title small{display:block;font-size:150px;color:var(--blue);letter-spacing:-2px;}
.subtitle{position:absolute;left:0;right:0;top:500px;text-align:center;color:var(--light);font-size:31px;font-weight:700;}
.tag{position:absolute;left:70px;right:70px;top:552px;text-align:center;color:#D7E3F0;font-size:21px;line-height:1.45;}

.panel{position:absolute;left:58px;right:58px;top:650px;display:flex;gap:18px;align-items:stretch;}
.card{flex:1;background:#fff;border-radius:16px;padding:18px 14px 16px;box-shadow:0 10px 24px rgba(0,0,0,.28);}
.card h4{display:flex;align-items:center;gap:8px;font-size:18.5px;white-space:nowrap;color:#1A202C;font-weight:800;}
.card .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:900;line-height:1;}
.card.minus .ic{background:#FF8533;}
.card.plus .ic{background:var(--blue);}
.card ul{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:11px;}
.card li{display:flex;align-items:center;gap:10px;}
.card li em{width:20px;height:20px;border-radius:50%;flex:0 0 auto;}
.card.minus li em{background:#FFE3CF;}
.card.plus li em{background:#DCEBF8;}
.card li s{display:block;height:10px;border-radius:5px;background:#E2E8F0;text-decoration:none;}
.join{align-self:center;color:#fff;font-size:46px;font-weight:900;}

.chips{position:absolute;left:0;right:0;top:880px;display:flex;justify-content:center;gap:12px;}
.chips span{border:2px solid rgba(133,203,255,.55);color:#EAF3FB;font-size:17px;font-weight:700;padding:7px 14px;border-radius:30px;}

.band{position:absolute;left:0;right:0;top:948px;height:96px;background:linear-gradient(180deg,#3B8DD0,var(--blue));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:40px;letter-spacing:1px;}

/* Inhalt Seitenrücken */
.spine-band{position:absolute;left:0;right:0;top:948px;height:96px;background:linear-gradient(90deg,#1F5E93,#2A73B0);}
.spine{position:absolute;left:0;right:0;top:70px;display:flex;flex-direction:column;align-items:center;gap:70px;}
.spine div{display:flex;flex-direction:column;align-items:center;gap:14px;color:#DDE8F3;font-size:27px;font-weight:700;}
.spine svg{width:84px;height:84px;stroke:var(--blue);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<div class="scene">
  <div class="shadow"></div>
  <div class="box">

    <div class="face side">
      <div class="spine">
        <div><svg viewBox="0 0 64 64"><rect x="10" y="14" width="44" height="40" rx="5"/><path d="M10 26h44M22 8v12M42 8v12"/><path d="M22 38l6 6 12-12"/></svg>Fahrplan</div>
        <div><svg viewBox="0 0 64 64"><circle cx="20" cy="32" r="13"/><circle cx="44" cy="32" r="13"/><path d="M14 32h12M44 26v12M38 32h12"/></svg>3+3-Methode</div>
        <div><svg viewBox="0 0 64 64"><path d="M10 30h44v6a16 16 0 0 1-16 16H26a16 16 0 0 1-16-16z"/><path d="M4 30h56M24 22c0-4 4-4 4-8M34 22c0-4 4-4 4-8"/></svg>Rezepte</div>
        <div><svg viewBox="0 0 64 64"><path d="M12 14h40a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H30l-12 10V44h-6a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z"/><path d="M22 29h.01M32 29h.01M42 29h.01" stroke-width="5"/></svg>Unterstützung</div>
      </div>
      <div class="spine-band"></div>
    </div>

    <div class="face front">
      <div class="brand"><div class="g"><img src="../../bilder/favicon.png" alt=""></div><div class="t">GICHT<span>LOTSE</span></div></div>
      <div class="badge"><b>14</b><i>TAGE</i></div>

      <div class="title">GICHTKLAR<small>14</small></div>
      <div class="subtitle">Das 3+3-Ernährungssystem bei Gicht</div>
      <div class="tag">In 14 Tagen zu deinem klaren Ernährungsplan.<br>Ohne komplizierte Diät, ohne Verbotstabellen</div>

      <div class="panel">
        <div class="card minus"><h4><span class="ic">−</span>3 einschränken</h4>
          <ul><li><em></em><s style="width:70%"></s></li><li><em></em><s style="width:55%"></s></li><li><em></em><s style="width:64%"></s></li></ul></div>
        <div class="join">+</div>
        <div class="card plus"><h4><span class="ic">+</span>3 bewusst nutzen</h4>
          <ul><li><em></em><s style="width:62%"></s></li><li><em></em><s style="width:74%"></s></li><li><em></em><s style="width:50%"></s></li></ul></div>
      </div>

      <div class="chips"><span>14-Tage-Fahrplan</span><span>Rezepte</span><span>Einkaufslisten</span></div>
      <div class="band">KLARHEIT STATT VERBOTE</div>
    </div>

  </div>
</div>
</body>
</html>
